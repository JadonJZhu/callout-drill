<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Callout Drill</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Callout Drill</h1>
    <div id="chooser"></div>
    <div class="controls">
      <button id="study" aria-pressed="false">Study</button>
      <button id="read-aloud" aria-pressed="false" hidden>Read aloud</button>
      <button id="reset">Reset</button>
      <div class="help">
        <button id="help" aria-label="How this works" aria-describedby="help-text">?</button>
        <div id="help-text" role="tooltip">Click where the callout is on the map. Callouts you get right come back later, and ones you miss come back sooner. The dots show how well you know each callout, and the score covers your last 20 answers.</div>
      </div>
    </div>
  </header>
  <main>
    <div id="panel">
      <div id="prompt" aria-live="polite"></div>
      <div id="memory"></div>
      <div id="status"></div>
    </div>
    <div id="tally">
      <div id="score"></div>
      <div id="counts"></div>
    </div>
    <svg id="map" viewBox="0 0 100 100" aria-label="Map"></svg>
  </main>
  <script type="module" src="src/app.js"></script>
</body>
</html>
